<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Web Development Class</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f5;
      color: #333333;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .card {
      background-color: #ffffff;
      max-width: 500px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .profile-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    h1 {
      color: #1a5276;
      margin-top: 0;
      font-size: 26px;
    }

    p {
      color: #555555;
      font-size: 16px;
      line-height: 1.6;
    }

    /* Styling for the link */
    .website-link {
      display: inline-block;
      margin-top: 15px;
      color: #1a5276;
      font-weight: bold;
      text-decoration: none;
    }

    .website-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="travel.jpg" alt="My travel photo" class="profile-img">

    <h1>Introduction to Web Development</h1>
    <p>Welcome to my first webpage! In this class, we are learning how to build and host real websites using HTML, GitHub, and GitHub Pages.</p>

    <!-- Clickable External Link -->
    <a href="https://www.youtube.com/watch?v=kMcb40uhRjA" target="_blank" rel="noopener noreferrer" class="website-link">
      Check out my favorite site!
    </a>
  </div>

</body>
</html>
